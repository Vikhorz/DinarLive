
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>DinarLive</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3e%3crect x='8' y='8' width='84' height='84' rx='10' fill='%23000'/%3e%3ctext x='50' y='61' font-family='Noto Kufi Arabic, sans-serif' font-size='34' font-weight='bold' fill='%23fff' text-anchor='middle'%3eد.ع%3c/text%3e%3c/svg%3e" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          'noto-kufi-arabic': ['"Noto Kufi Arabic"', 'sans-serif'],
          'jetbrains': ['"JetBrains Mono"', 'monospace'],
        },
        screens: {
          'xs': '375px',
        },
      },
    },
  }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  (function() {
    try {
      var storedTheme = localStorage.getItem('theme');
      var root = document.documentElement;
      var resolvedTheme = storedTheme === 'dark' || storedTheme === 'light'
        ? storedTheme
        : 'light';

      if (resolvedTheme === 'dark') {
        root.classList.add('dark');
        root.classList.remove('light');
      } else {
        root.classList.add('light');
        root.classList.remove('dark');
        if (!storedTheme) localStorage.setItem('theme', 'light');
      }
      root.dataset.theme = resolvedTheme;
      root.style.colorScheme = resolvedTheme;
      var lang = localStorage.getItem('language') || 'ku';
      root.lang = lang;
      root.dir = lang === 'en' ? 'ltr' : 'rtl';
    } catch (e) {
      console.error('Theme initialization failed', e);
    }
  })();
</script>
<style>
  html, body {
    overflow-x: hidden;
    position: relative;
    width: 100%;
    -webkit-text-size-adjust: 100%;
  }
  body {
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  html[dir="rtl"] body {
    font-family: 'Noto Kufi Arabic', sans-serif;
  }
  /* Fix Kurdish letter spacing issues by forcing zero spacing in RTL mode */
  html[dir="rtl"] * {
    letter-spacing: 0 !important;
    word-spacing: normal !important;
  }
  html[dir="rtl"] .tracking-tight, 
  html[dir="rtl"] .tracking-tighter,
  html[dir="rtl"] .tracking-wider,
  html[dir="rtl"] .tracking-widest {
    letter-spacing: 0 !important;
  }
  html[dir="ltr"] body {
    font-family: 'Noto Kufi Arabic', sans-serif;
  }
  * {
    box-sizing: border-box;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="transition-colors duration-300 antialiased">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
