<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          'noto-kufi-arabic': ['"Noto Kufi Arabic"', 'sans-serif'],
        },
        screens: {
          'xs': '375px',
        },
      },
    },
  }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  (function() {
    try {
      var storedTheme = localStorage.getItem('theme');
      var root = document.documentElement;
      if (storedTheme === 'dark') {
        root.classList.add('dark');
        root.classList.remove('light');
      } else {
        root.classList.add('light');
        root.classList.remove('dark');
        if (!storedTheme) localStorage.setItem('theme', 'light');
      }
      var lang = localStorage.getItem('language') || 'ku';
      root.lang = lang;
      root.dir = lang === 'en' ? 'ltr' : 'rtl';
    } catch (e) {
      console.error('Theme initialization failed', e);
    }
  })();
</script>
<style>
  html, body {
    overflow-x: hidden;
    position: relative;
    width: 100%;
    -webkit-text-size-adjust: 100%;
  }
  body {
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  html[dir="rtl"] body {
    font-family: 'Noto Kufi Arabic', sans-serif;
  }
  /* Fix Kurdish letter spacing issues by forcing zero spacing in RTL mode */
  html[dir="rtl"] * {
    letter-spacing: 0 !important;
    word-spacing: normal !important;
  }
  html[dir="rtl"] .tracking-tight, 
  html[dir="rtl"] .tracking-tighter,
  html[dir="rtl"] .tracking-wider,
  html[dir="rtl"] .tracking-widest {
    letter-spacing: 0 !important;
  }
  html[dir="ltr"] body {
    font-family: 'Poppins', sans-serif;
  }
  * {
    box-sizing: border-box;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
